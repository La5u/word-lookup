<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Word Lookup</title>
    <link rel="stylesheet" href="settings.css">
  </head>
  <body>
    <main>
      <h1>Word Lookup</h1>
      <label class="toggle" for="enabled">
        <span>Enable lookups</span>
        <input id="enabled" type="checkbox">
      </label>
      <label class="toggle" for="show-examples">
        <span>Show example sentences</span>
        <input id="show-examples" type="checkbox">
      </label>
      <label class="toggle" for="show-gender">
        <span>Show noun gender</span>
        <input id="show-gender" type="checkbox">
      </label>
      <label class="toggle" for="show-not-found">
        <span>Show “no entry found”</span>
        <input id="show-not-found" type="checkbox">
      </label>
      <label for="language">Source language</label>
      <select id="language"></select>
    </main>
    <script src="languages.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
